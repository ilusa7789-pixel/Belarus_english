  h+=`<div class="grid ${list.length>4?'two':''}">`+list.map(c=>`<div class="card rv"><div class="e">${c[0]}</div><div><h3>${c[1]}</h3><p>${c[2]}</p></div></div>`).join('')+`</div>`;
  $('#'+id).innerHTML=h;
}
function render(){
  const T=S[lang];document.documentElement.lang=lang;$('#lang').textContent=lang==='en'?'RU':'EN';
  $('#h1').innerHTML=T.title.split(' ').map((w,i)=>`<span style="animation-delay:${i*.25}s">${w}</span>`).join(' ');
  document.title=T.title;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[e.dataset.i]);
  $('#mq').textContent=T.mq.repeat(4);$('#mn').textContent=T.mn;
  sec('s1',1,0,[],`<div class="stats rv">${T.f1.map(f=>`<div class="stat"><strong>${f[0]}</strong><small>${f[1]}</small></div>`).join('')}</div>`);
  $('#s1').querySelector('.grid').remove();
  $('#geo').innerHTML=`<p class="t rv">${T.i2}</p><div class="grid two">`+T.g2.map(c=>`<div class="card rv"><div class="e">${c[0]}</div><div><h3>${c[1]}</h3><p>${c[2]}</p></div></div>`).join('')+'</div>';
  $('#f2').innerHTML=frame('s2',2);
  sec('s3',3,0,T.g3);sec('s4',4,0,T.g4);sec('s5',5,0,T.g5);sec('s6',6,0,T.g6);sec('s7',7,0,T.g7);
  watch();
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.15});
function watch(){document.querySelectorAll('.rv:not(.on)').forEach(e=>io.observe(e))}
addEventListener('scroll',()=>{$('#bar').style.width=scrollY/(document.body.scrollHeight-innerHeight)*100+'%'});
$('#lang').onclick=()=>{lang=lang==='en'?'ru':'en';localStorage.setItem('lang',lang);render();if($('#ov').classList.contains('on'))showQ()};
// quiz
let qi=0,sc=0,sel=-1,done=false,fin=false;
function showQ(){
  const T=S[lang],i=li(lang);
  if(fin)return showRes();
  const q=Q[qi];
  $('#qb').innerHTML=`<div class="qn">${T.of} ${qi+1}/${Q.length}</div><div class="prog"><i style="width:${(qi+(done?1:0))/Q.length*100}%"></i></div><div class="q">${q.q[i]}</div>`+
  q.o[i].map((o,k)=>`<button class="opt ${sel===k?'sel':''} ${done&&k===q.a?'good':''} ${done&&sel===k&&k!==q.a?'bad':''}" data-k="${k}">${o}</button>`).join('')+
  `<div style="text-align:center;margin-top:14px"><button class="btn" id="go" ${sel<0?'disabled':''}>${done?(qi===Q.length-1?T.fin:T.next):T.conf}</button></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;sel=+b.dataset.k;showQ()});
  $('#go').onclick=()=>{
    if(!done){done=true;if(sel===q.a)sc++;showQ()}
    else{if(qi===Q.length-1){fin=true;showRes()}else{qi++;sel=-1;done=false;showQ()}}};
}
function showRes(){
  const T=S[lang],p=sc===5?0:sc===4?1:sc===3?2:sc===2?3:4;
  $('#qb').innerHTML=`<div class="res"><div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" stroke="#1c2a2322" pathLength="100"/><circle class="rg" cx="18" cy="18" r="15.9" pathLength="100"/></svg><span id="num">0</span></div><div class="qn">${sc}/${Q.length} ${T.pts}</div><h3 style="margin:14px 0 20px;font-size:24px">${T.ph[p]}</h3><button class="btn" id="re">${T.again}</button></div>`;
  setTimeout(()=>{$('.rg').style.strokeDashoffset=100-sc/Q.length*100},50);
  let n=0;const t=setInterval(()=>{if(n>=sc){clearInterval(t);return}n++;$('#num').textContent=n},400);
  $('#re').onclick=()=>{qi=0;sc=0;sel=-1;done=false;fin=false;showQ()};
}
$('#qs').onclick=()=>{qi=0;sc=0;sel=-1;done=false;fin=false;$('#ov').classList.add('on');showQ()};
$('#qx').onclick=()=>$('#ov').classList.remove('on');
